<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Live Stream Event</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h2>Redirecting to live coverage...</h2>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const aaParam = urlParams.get('aa');

        let targetTitle = "";
        const targetUrl = "https://movietimes.online/en/movie/1339713/obsession";

        if (aaParam === 'event1') {
            targetTitle = "~(~~>>LIVESTREAMS!^^~) AC Milan vs Bologna Live Free Soccer On TV October 28, 2026";
        } 
        else if (aaParam === 'event2') {
            targetTitle = "!+~~~[St r e a m]!^ AC Milan vs Bologna LIVE Free Broadcast October 28, 2026";
        }
        else if (aaParam === 'event3') {
            targetTitle = "!~~#(LIVESTREAm>>>>) AC Milan vs Bologna Live Free Coverage October 28, 2026";
        }
        else if (aaParam === 'event4') {
            targetTitle = "!~~@!<<[LIVE-STREAM!]<><>* AC Milan vs Bologna Live Stream Free Game Online October 28, 2026";
        }
        else if (aaParam === 'event5') {
            targetTitle = "!~><((~~LIVESTREAM~)) AC Milan vs Bologna Live Stream Soccer Today October 28, 2026";
        }

        if (targetTitle !== "") {
            // Aage title change korbe
            document.title = targetTitle;
            if (document.getElementById('pageTitle')) {
                document.getElementById('pageTitle').textContent = targetTitle;
            }

            // Ager title change properly apply howar jonno 300ms delay diye redirect korbe
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 300);
        }
    </script>
</body>
</html>
